services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yansoft
      POSTGRES_PASSWORD: yansoft
      POSTGRES_DB: yansoft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: